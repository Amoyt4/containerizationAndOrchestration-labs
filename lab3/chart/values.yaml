nameOverride: shop

api:
  spread:
    mechanism: topologySpread
  replicaCount: 3
  image:
    repository: docker.io/library/shop-api
    tag: v1
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    HEALTH_FAIL: "false"
    PORT: "8080"
    DATABASE_URL: "postgres://shop:shop@shop-shop-postgres-rw:5432/shop?sslmode=disable"

worker:
  replicaCount: 2
  image:
    repository: docker.io/library/shop-worker
    tag: v1
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    DATABASE_URL: "postgres://shop:shop@shop-shop-postgres-rw:5432/shop?sslmode=disable"