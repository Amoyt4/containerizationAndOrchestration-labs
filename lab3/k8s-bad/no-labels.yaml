apiVersion: v1
kind: Pod
metadata:
  name: bad-no-labels
  namespace: shop
  # НЕТ labels app.kubernetes.io/name и app.kubernetes.io/part-of
spec:
  containers:
    - name: app
      image: docker.io/library/nginx:1.27
      resources:
        requests: { cpu: "100m", memory: "128Mi" }
        limits:   { cpu: "200m", memory: "256Mi" }
      securityContext:
        runAsNonRoot: true
        privileged: false
        allowPrivilegeEscalation: false