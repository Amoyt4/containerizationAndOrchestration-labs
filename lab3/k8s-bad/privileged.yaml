apiVersion: v1
kind: Pod
metadata:
  name: bad-privileged
  namespace: shop
  labels:
    app.kubernetes.io/name: bad-pod
    app.kubernetes.io/part-of: shop
spec:
  containers:
    - name: app
      image: docker.io/library/nginx:1.27
      resources:
        requests: { cpu: "100m", memory: "128Mi" }
        limits:   { cpu: "200m", memory: "256Mi" }
      securityContext:
        privileged: true          # ← ЗАПРЕЩЕНО
        runAsNonRoot: true