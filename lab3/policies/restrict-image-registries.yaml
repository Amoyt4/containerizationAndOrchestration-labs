apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-registry
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - local-path-storage
                - ingress-nginx
                - kyverno
      validate:
        message: "Разрешены только образы из docker.io и ghcr.io (с явным префиксом)"
        pattern:
          spec:
            containers:
              - image: "docker.io/* | ghcr.io/*"