apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-non-root
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-runAsNonRoot
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - local-path-storage
                - ingress-nginx
                - kyverno
      validate:
        message: "Контейнеры должны запускаться от непривилегированного пользователя (runAsNonRoot: true)"
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true