apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "shop.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  priorityClassName: shop-shop-high
  inheritedMetadata:
    labels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: shop
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: shop
      owner: shop
      secret:
        name: {{ include "shop.fullname" . }}-postgres-app
  resources:
    requests:
      cpu: 200m
      memory: 400Mi
    limits:
      cpu: 200m
      memory: 400Mi