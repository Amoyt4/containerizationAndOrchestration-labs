nameOverride: shop

api:
  replicaCount: 3
  priorityClassName: shop-shop-high
  image:
    repository: docker.io/library/shop-api
    tag: v1
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 50m
      memory: 100Mi
  env:
    HEALTH_FAIL: "false"
    PORT: "8080"
    DATABASE_URL: "postgres://shop:shop@shop-shop-postgres-rw:5432/shop?sslmode=disable"
  spread:
    maxSkew: 1
    whenUnsatisfiable: DoNotSchedule

worker:
  replicaCount: 2
  priorityClassName: shop-shop-high
  image:
    repository: docker.io/library/shop-worker
    tag: v1
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 50m
      memory: 100Mi
  env:
    DATABASE_URL: "postgres://shop:shop@shop-shop-postgres-rw:5432/shop?sslmode=disable"

batch:
  replicaCount: 2
  priorityClassName: shop-shop-low
  image:
    repository: docker.io/library/shop-batch
    tag: v3
    pullPolicy: IfNotPresent
  env:
    MB_PER_TICK: "50"
    TICK_INTERVAL: "2s"
    MAX_MB: "1000"
    ENABLE_CPU_BURN: "false"
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 500m
      memory: 1200Mi   

priorityClasses:
  high:
    value: 1000
  low:
    value: 100

podDisruptionBudgets:
  api:
    enabled: true
    minAvailable: 2
  postgres:
    enabled: true
    minAvailable: 1