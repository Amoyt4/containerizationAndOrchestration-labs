apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-kps-kube-prometheus-stack-alertmanager
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: telegram
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h

    receivers:
      - name: telegram
        telegram_configs:
          - bot_token: 'бе бе бе НИЧЕГО Я ВАМ НЕ ПОКАЖУ'
            chat_id: И ID ЧАТА ТОЖЕ не узнаете))
            parse_mode: 'HTML'
            send_resolved: true