apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: api:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 1414
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "jaeger.monitoring:4317"
            - name: OTEL_SERVICE_NAME
              value: "api"
            - name: SELF_URL
              value: "http://localhost:1414"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 1414
      targetPort: 1414